name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Teste 01 - Atribuição Números
      id: teste01
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Teste 01 - Atribuição Números
        setup-command: ''
        command: mvn test -Dtest=ValidadorFase4Test#test01_AtribuicaoENumeros -f fase04-dando-significado/pom.xml
        timeout: 10
        max-score: 3

    - name: Teste 02 - Precedência matemática
      id: teste02
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Teste 02 - Estruturas de controle
        setup-command: ''
        command: mvn test -Dtest=ValidadorFase4Test#test02_PrecedenciaNaAST -f fase04-dando-significado/pom.xml
        timeout: 10
        max-score: 3

    - name: Teste 03 - Agrupamento de múltiplos comandos
      id: teste03
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Teste 03 - Agrupamento de múltiplos comandos
        setup-command: ''
        command: mvn test -Dtest=ValidadorFase4Test#test03_MultiplosComandos -f fase04-dando-significado/pom.xml
        timeout: 10
        max-score: 2

    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TESTE01_RESULTS: "${{steps.teste01.outputs.result}}"
        TESTE02_RESULTS: "${{steps.teste02.outputs.result}}"
        TESTE03_RESULTS: "${{steps.teste03.outputs.result}}"
      with:
        runners: teste01,teste02,teste03